<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>1D Wave Equation Simulator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .equation {
      text-align: center;
      font-size: 20px;
      margin-bottom: 22px;
    }

    .panel {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 10px;
    }

    canvas {
      display: block;

      width: 100%;
      height: auto;

      background: white;
      border: 1px solid #bbb;
    }

    button {
      padding: 9px 18px;
      margin-right: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    select {
      padding: 7px;
      font-size: 14px;
    }

    .controls {
      margin-top: 16px;
    }

    .status {
      margin-top: 14px;
      font-family: monospace;
      font-size: 14px;
    }

    .parameter-grid {
      display: grid;
      grid-template-columns: 170px 150px;
      gap: 8px;
      font-family: monospace;
    }

    .stable {
      font-weight: bold;
    }

    .description {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>


<body>

  <h1>1D Wave Equation Simulator</h1>

  <div class="equation">
    ∂²u/∂t² = c² ∂²u/∂x²
  </div>


  <!-- =========================
       Simulation
       ========================= -->

  <div class="panel">

    <h2>Simulation</h2>

    <canvas
      id="waveCanvas"
      width="900"
      height="440">
    </canvas>


    <div class="controls">

      <button id="playButton">
        Play
      </button>

      <button id="pauseButton">
        Pause
      </button>

      <button id="resetButton">
        Reset
      </button>

    </div>


    <div class="status">

      Time =
      <span id="timeDisplay">
        0.000
      </span>
      s

    </div>

  </div>


  <!-- =========================
       Parameters
       ========================= -->

  <div class="panel">

    <h2>Parameters</h2>

    <div class="parameter-grid">

      <div>L</div>
      <div id="LDisplay"></div>

      <div>N</div>
      <div id="NDisplay"></div>

      <div>Δx</div>
      <div id="dxDisplay"></div>

      <div>c</div>
      <div id="cDisplay"></div>

      <div>Δt</div>
      <div id="dtDisplay"></div>

      <div>CFL number</div>
      <div
        id="cflDisplay"
        class="stable">
      </div>

    </div>

  </div>


  <!-- =========================
       Initial condition
       ========================= -->

  <div class="panel">

    <h2>Initial Condition</h2>

    <p>
      u(x, 0) = f(x)
    </p>

    <select id="initialCondition">

      <option value="sine">
        sin(πx)
      </option>

      <option value="pluck">
        Plucked String
      </option>

      <option value="gaussian">
        Gaussian Pulse
      </option>

    </select>

    <p
      id="initialDescription"
      class="description">
    </p>

  </div>


<script>

/* =========================================================
   1. Physical / numerical parameters
   ========================================================= */

const L = 1.0;

/*
  interval 개수

  N = 100 이므로
  node는 101개:

  x_0, x_1, ..., x_100
*/

const N = 100;

const dx = L / N;


/*
  wave speed
*/

const c = 1.0;


/*
  CFL condition:

      c Δt / Δx <= 1

  안정성을 위해 0.8 사용
*/

const CFL = 0.8;

const dt =
  CFL * dx / c;


/* =========================================================
   2. Spatial grid
   ========================================================= */

const x =
  new Array(N + 1);

for (
  let i = 0;
  i <= N;
  i++
) {

  x[i] =
    i * dx;

}


/* =========================================================
   3. Wave arrays
   ========================================================= */

/*
  uPrev = u at previous time

  uCurr = u at current time

  uNext = u at next time
*/

let uPrev =
  new Array(N + 1).fill(0);

let uCurr =
  new Array(N + 1).fill(0);

let uNext =
  new Array(N + 1).fill(0);


/*
  simulation time
*/

let time = 0;


/*
  첫 time step인지 여부

  t = 0에서는
  initial velocity를 이용한 별도 공식이 필요하다.
*/

let firstStepPending = true;


/* =========================================================
   4. Initial condition
   ========================================================= */

function initialFunction(xValue) {

  const type =
    document
    .getElementById(
      "initialCondition"
    )
    .value;


  /* -----------------------------------------
     1. Sine
     ----------------------------------------- */

  if (
    type === "sine"
  ) {

    return Math.sin(
      Math.PI * xValue
    );

  }


  /* -----------------------------------------
     2. Plucked string
     ----------------------------------------- */

  if (
    type === "pluck"
  ) {

    const x0 = 0.35;

    const A = 1.0;


    if (
      xValue <= x0
    ) {

      return (
        A * xValue / x0
      );

    }

    else {

      return (
        A
        * (L - xValue)
        / (L - x0)
      );

    }

  }


  /* -----------------------------------------
     3. Gaussian pulse
     ----------------------------------------- */

  if (
    type === "gaussian"
  ) {

    const A = 1.0;

    const x0 = 0.5;

    const sigma = 0.08;


    return (
      A
      * Math.exp(

        - Math.pow(
            xValue - x0,
            2
          )

        /
        (
          2
          * sigma
          * sigma
        )

      )
    );

  }


  return 0;

}


/* =========================================================
   5. Initial condition description
   ========================================================= */

function updateDescription() {

  const type =
    document
    .getElementById(
      "initialCondition"
    )
    .value;

  const description =
    document
    .getElementById(
      "initialDescription"
    );


  if (
    type === "sine"
  ) {

    description.textContent =
      "Initial displacement: f(x) = sin(πx), initial velocity: g(x) = 0";

  }


  if (
    type === "pluck"
  ) {

    description.textContent =
      "Triangular initial displacement with peak at x = 0.35, initial velocity: g(x) = 0";

  }


  if (
    type === "gaussian"
  ) {

    description.textContent =
      "Gaussian initial displacement centered at x = 0.5, initial velocity: g(x) = 0";

  }

}


/* =========================================================
   6. Initialize simulation
   ========================================================= */

function initializeWave() {

  time = 0;

  firstStepPending = true;


  /*
    initial displacement

        u(x,0) = f(x)
  */

  for (
    let i = 0;
    i <= N;
    i++
  ) {

    uCurr[i] =
      initialFunction(
        x[i]
      );

  }


  /*
    Fixed boundary condition

        u(0,t) = 0
        u(L,t) = 0
  */

  uCurr[0] = 0;

  uCurr[N] = 0;


  /*
    이전 배열도 현재 초기상태로 초기화
  */

  uPrev =
    [...uCurr];

  uNext =
    new Array(
      N + 1
    ).fill(0);


  document
    .getElementById(
      "timeDisplay"
    )
    .textContent =
      time.toFixed(3);


  updateDescription();

  drawWave();

}


/* =========================================================
   7. Numerical solver
   ========================================================= */

function updateWave() {

  const r =
    c * dt / dx;


  /*
    첫 번째 time step

    Taylor expansion:

    u_i^1 =
      u_i^0
      + Δt g_i
      + 1/2 r²
        (u_{i+1}^0
        - 2u_i^0
        + u_{i-1}^0)

    현재는

      g(x) = 0
  */

  if (
    firstStepPending
  ) {

    for (
      let i = 1;
      i < N;
      i++
    ) {

      uNext[i] =

        uCurr[i]

        +

        0.5
        * r
        * r

        *
        (
          uCurr[i + 1]
          - 2 * uCurr[i]
          + uCurr[i - 1]
        );

    }


    uNext[0] = 0;

    uNext[N] = 0;


    uPrev =
      [...uCurr];

    uCurr =
      [...uNext];


    firstStepPending = false;

    time = dt;

    return;

  }


  /*
    일반적인 finite difference update

    u_i^{n+1}

    =
    2u_i^n
    - u_i^{n-1}

    +
    r²
    (
      u_{i+1}^n
      - 2u_i^n
      + u_{i-1}^n
    )
  */

  for (
    let i = 1;
    i < N;
    i++
  ) {

    uNext[i] =

      2 * uCurr[i]

      - uPrev[i]

      +

      r
      * r

      *
      (
        uCurr[i + 1]
        - 2 * uCurr[i]
        + uCurr[i - 1]
      );

  }


  /*
    fixed endpoints
  */

  uNext[0] = 0;

  uNext[N] = 0;


  /*
    advance time
  */

  uPrev =
    [...uCurr];

  uCurr =
    [...uNext];


  time += dt;

}


/* =========================================================
   8. Canvas
   ========================================================= */

const canvas =
  document
  .getElementById(
    "waveCanvas"
  );

const ctx =
  canvas
  .getContext(
    "2d"
  );


/* =========================================================
   9. Draw graph
   ========================================================= */

function drawWave() {

  const width =
    canvas.width;

  const height =
    canvas.height;


  /*
    clear canvas
  */

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /* -----------------------------------------
     Plot dimensions
     ----------------------------------------- */

  const marginLeft = 65;

  const marginRight = 30;

  const marginTop = 30;

  const marginBottom = 55;


  const plotWidth =
    width
    - marginLeft
    - marginRight;


  const plotHeight =
    height
    - marginTop
    - marginBottom;


  /*
    fixed y-axis range
  */

  const yMin = -1.2;

  const yMax = 1.2;


  /* -----------------------------------------
     Coordinate transform
     ----------------------------------------- */

  function xToPixel(
    xValue
  ) {

    return (
      marginLeft
      +
      (xValue / L)
      * plotWidth
    );

  }


  function yToPixel(
    yValue
  ) {

    return (
      marginTop

      +

      (
        yMax - yValue
      )

      /
      (
        yMax - yMin
      )

      *
      plotHeight
    );

  }


  /* -----------------------------------------
     Plot background
     ----------------------------------------- */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    marginLeft,
    marginTop,
    plotWidth,
    plotHeight
  );


  /* -----------------------------------------
     Vertical grid
     ----------------------------------------- */

  ctx.strokeStyle =
    "#e6e6e6";

  ctx.lineWidth = 1;


  for (
    let j = 0;
    j <= 10;
    j++
  ) {

    const xValue =
      j / 10;

    const px =
      xToPixel(
        xValue
      );


    ctx.beginPath();

    ctx.moveTo(
      px,
      marginTop
    );

    ctx.lineTo(
      px,
      marginTop
      + plotHeight
    );

    ctx.stroke();

  }


  /* -----------------------------------------
     Horizontal grid
     ----------------------------------------- */

  const yTicks = [
    -1.0,
    -0.5,
    0,
    0.5,
    1.0
  ];


  for (
    const yValue
    of yTicks
  ) {

    const py =
      yToPixel(
        yValue
      );


    ctx.beginPath();

    ctx.moveTo(
      marginLeft,
      py
    );

    ctx.lineTo(
      marginLeft
      + plotWidth,
      py
    );

    ctx.stroke();

  }


  /* -----------------------------------------
     Plot border
     ----------------------------------------- */

  ctx.strokeStyle =
    "#777";

  ctx.lineWidth = 1;

  ctx.strokeRect(
    marginLeft,
    marginTop,
    plotWidth,
    plotHeight
  );


  /* -----------------------------------------
     x axis, u = 0
     ----------------------------------------- */

  const zeroY =
    yToPixel(0);


  ctx.strokeStyle =
    "#555";

  ctx.lineWidth = 1.4;

  ctx.beginPath();

  ctx.moveTo(
    marginLeft,
    zeroY
  );

  ctx.lineTo(
    marginLeft
    + plotWidth,
    zeroY
  );

  ctx.stroke();


  /* -----------------------------------------
     x tick labels
     ----------------------------------------- */

  ctx.fillStyle =
    "#333";

  ctx.font =
    "13px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "top";


  for (
    let j = 0;
    j <= 10;
    j++
  ) {

    const xValue =
      j / 10;

    const px =
      xToPixel(
        xValue
      );


    ctx.fillText(
      xValue.toFixed(1),
      px,
      marginTop
      + plotHeight
      + 8
    );

  }


  /* -----------------------------------------
     y tick labels
     ----------------------------------------- */

  ctx.textAlign =
    "right";

  ctx.textBaseline =
    "middle";


  for (
    const yValue
    of yTicks
  ) {

    const py =
      yToPixel(
        yValue
      );


    ctx.fillText(
      yValue.toFixed(1),
      marginLeft - 9,
      py
    );

  }


  /* -----------------------------------------
     Axis titles
     ----------------------------------------- */

  ctx.fillStyle =
    "#111";

  ctx.font =
    "15px Arial";


  /*
    x
  */

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "bottom";


  ctx.fillText(
    "x",
    marginLeft
    + plotWidth / 2,
    height - 5
  );


  /*
    u(x,t)
  */

  ctx.save();

  ctx.translate(
    18,
    marginTop
    + plotHeight / 2
  );

  ctx.rotate(
    -Math.PI / 2
  );

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "u(x,t)",
    0,
    0
  );

  ctx.restore();


  /* -----------------------------------------
     Wave
     ----------------------------------------- */

  ctx.strokeStyle =
    "#0066cc";

  ctx.lineWidth = 3;

  ctx.beginPath();


  for (
    let i = 0;
    i <= N;
    i++
  ) {

    const px =
      xToPixel(
        x[i]
      );

    const py =
      yToPixel(
        uCurr[i]
      );


    if (
      i === 0
    ) {

      ctx.moveTo(
        px,
        py
      );

    }

    else {

      ctx.lineTo(
        px,
        py
      );

    }

  }


  ctx.stroke();


  /* -----------------------------------------
     Fixed boundary points
     ----------------------------------------- */

  ctx.fillStyle =
    "#d00000";


  /*
    x = 0
  */

  ctx.beginPath();

  ctx.arc(
    xToPixel(0),
    yToPixel(0),
    5,
    0,
    2 * Math.PI
  );

  ctx.fill();


  /*
    x = L
  */

  ctx.beginPath();

  ctx.arc(
    xToPixel(L),
    yToPixel(0),
    5,
    0,
    2 * Math.PI
  );

  ctx.fill();

}


/* =========================================================
   10. Animation
   ========================================================= */

let running = false;


/*
  한 화면 frame마다
  numerical time step을 몇 번 진행할지

  너무 빠르면 1로 줄이면 된다.
*/

const stepsPerFrame = 2;


function animate() {

  if (
    !running
  ) {

    return;

  }


  for (
    let step = 0;
    step < stepsPerFrame;
    step++
  ) {

    updateWave();

  }


  drawWave();


  document
    .getElementById(
      "timeDisplay"
    )
    .textContent =
      time.toFixed(3);


  requestAnimationFrame(
    animate
  );

}


/* =========================================================
   11. Buttons
   ========================================================= */

document
  .getElementById(
    "playButton"
  )
  .addEventListener(
    "click",
    function () {

      if (
        !running
      ) {

        running = true;

        requestAnimationFrame(
          animate
        );

      }

    }
  );


document
  .getElementById(
    "pauseButton"
  )
  .addEventListener(
    "click",
    function () {

      running = false;

    }
  );


document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function () {

      running = false;

      initializeWave();

    }
  );


/* =========================================================
   12. Initial condition selector
   ========================================================= */

document
  .getElementById(
    "initialCondition"
  )
  .addEventListener(
    "change",
    function () {

      running = false;

      initializeWave();

    }
  );


/* =========================================================
   13. Parameter display
   ========================================================= */

document
  .getElementById(
    "LDisplay"
  )
  .textContent =
    L.toFixed(2);


document
  .getElementById(
    "NDisplay"
  )
  .textContent =
    N;


document
  .getElementById(
    "dxDisplay"
  )
  .textContent =
    dx.toFixed(4);


document
  .getElementById(
    "cDisplay"
  )
  .textContent =
    c.toFixed(2);


document
  .getElementById(
    "dtDisplay"
  )
  .textContent =
    dt.toFixed(4);


document
  .getElementById(
    "cflDisplay"
  )
  .textContent =
    (
      c * dt / dx
    ).toFixed(3)
    +
    " ✓ Stable";


/* =========================================================
   14. Start
   ========================================================= */

initializeWave();

</script>

</body>

</html>
