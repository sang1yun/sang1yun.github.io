<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>1D Wave Equation Simulator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .equation {
      text-align: center;
      font-size: 24px;
      margin: 20px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    canvas {
      width: 100%;
      height: 400px;
      border: 1px solid #aaa;
      background: white;
    }

    button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>1D Wave Equation Simulator</h1>

  <div class="equation">
    ∂²u/∂t² = c² ∂²u/∂x²
  </div>

  <div class="panel">

    <h2>Simulation</h2>

    <canvas id="waveCanvas"
            width="900"
            height="400">
    </canvas>

    <br><br>

    <button>Play</button>
    <button>Pause</button>
    <button>Reset</button>

  </div>

  <div class="panel">

    <h2>Parameters</h2>

    <p>
      L = 1
    </p>

    <p>
      N = 100
    </p>

    <p>
      Δx = 0.01
    </p>

    <p>
      c = 1
    </p>

  </div>

  <div class="panel">

    <h2>Initial Condition</h2>

    <p>
      u(x,0) = f(x)
    </p>

    <select>

      <option>
        sin(πx)
      </option>

      <option>
        Plucked String
      </option>

      <option>
        Gaussian Pulse
      </option>

      <option>
        Custom
      </option>

    </select>

  </div>

</body>
</html>
