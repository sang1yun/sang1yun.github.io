<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>1D Wave Equation Simulator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .equation {
      text-align: center;
      font-size: 20px;
      margin-bottom: 22px;
    }

    .panel {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border: 1px solid #bbb;
    }

    button {
      padding: 9px 18px;
      margin-right: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    select {
      padding: 7px;
      font-size: 14px;
    }

    input {
      padding: 9px 10px;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
    }

    .controls {
      margin-top: 16px;
    }

    .status {
      margin-top: 14px;
      font-family: monospace;
      font-size: 14px;
    }

    .parameter-grid {
      display: grid;
      grid-template-columns: 170px 150px;
      gap: 8px;
      font-family: monospace;
    }

    .stable {
      font-weight: bold;
    }

    .description {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .custom-box {
      margin-top: 16px;
      padding: 15px;
      background: #f6f8fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: none;
    }

    .custom-label {
      margin-bottom: 7px;
      font-weight: bold;
    }

    .custom-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .custom-row button {
      margin: 0;
    }

    .example-box {
      margin-top: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #555;
    }

    .error {
      margin-top: 10px;
      color: #cc0000;
      font-family: monospace;
      min-height: 18px;
    }

    .success {
      color: #087a22;
    }
  </style>
</head>


<body>

  <h1>1D Wave Equation Simulator</h1>

  <div class="equation">
    ∂²u/∂t² = c² ∂²u/∂x²
  </div>


  <!-- =====================================================
       Simulation
       ===================================================== -->

  <div class="panel">

    <h2>Simulation</h2>

    <canvas
      id="waveCanvas"
      width="900"
      height="440">
    </canvas>


    <div class="controls">

      <button id="playButton">
        Play
      </button>

      <button id="pauseButton">
        Pause
      </button>

      <button id="resetButton">
        Reset
      </button>

    </div>


    <div class="status">

      Time =
      <span id="timeDisplay">
        0.000
      </span>
      s

    </div>

  </div>


  <!-- =====================================================
       Parameters
       ===================================================== -->

  <div class="panel">

    <h2>Parameters</h2>

    <div class="parameter-grid">

      <div>L</div>
      <div id="LDisplay"></div>

      <div>N</div>
      <div id="NDisplay"></div>

      <div>Δx</div>
      <div id="dxDisplay"></div>

      <div>c</div>
      <div id="cDisplay"></div>

      <div>Δt</div>
      <div id="dtDisplay"></div>

      <div>CFL number</div>
      <div
        id="cflDisplay"
        class="stable">
      </div>

    </div>

  </div>


  <!-- =====================================================
       Initial condition
       ===================================================== -->

  <div class="panel">

    <h2>Initial Condition</h2>

    <p>
      u(x, 0) = f(x)
    </p>


    <select id="initialCondition">

      <option value="sine">
        sin(πx)
      </option>

      <option value="pluck">
        Plucked String
      </option>

      <option value="gaussian">
        Gaussian Pulse
      </option>

      <option value="custom">
        Custom Function
      </option>

    </select>


    <p
      id="initialDescription"
      class="description">
    </p>


    <!-- Custom function -->

    <div
      id="customBox"
      class="custom-box">

      <div class="custom-label">
        Enter f(x)
      </div>


      <div class="custom-row">

        <input
          type="text"
          id="customFunction"
          value="sin(2*pi*x)"
          placeholder="Example: sin(2*pi*x)">

        <button id="applyCustomButton">
          Apply
        </button>

      </div>


      <div class="example-box">

        Examples:<br>

        sin(2*pi*x)<br>

        0.5*sin(pi*x) + 0.3*sin(3*pi*x)<br>

        exp(-100*(x-0.5)^2)<br>

        x*(1-x)<br>

        sin(pi*x)^2

      </div>


      <div
        id="customError"
        class="error">
      </div>

    </div>

  </div>


<script>

/* =========================================================
   1. Physical / numerical parameters
   ========================================================= */

const L = 1.0;


/*
  Number of intervals

  N = 100

  therefore nodes are

  x_0, x_1, ..., x_100

  = 101 points
*/

const N = 100;

const dx = L / N;


/*
  Wave propagation speed
*/

const c = 1.0;


/*
  CFL condition

      c Δt / Δx <= 1

  We choose 0.8 for stability.
*/

const CFL = 0.8;

const dt =
  CFL * dx / c;


/* =========================================================
   2. Spatial grid
   ========================================================= */

const x =
  new Array(N + 1);


for (
  let i = 0;
  i <= N;
  i++
) {

  x[i] =
    i * dx;

}


/* =========================================================
   3. Wave arrays
   ========================================================= */

let uPrev =
  new Array(N + 1).fill(0);

let uCurr =
  new Array(N + 1).fill(0);

let uNext =
  new Array(N + 1).fill(0);


let time = 0;

let firstStepPending = true;


/* =========================================================
   4. Custom mathematical expression parser
   ========================================================= */


/*
  Supported:

  numbers

  x

  pi
  e

  +
  -
  *
  /
  ^

  parentheses

  sin()
  cos()
  tan()
  exp()
  sqrt()
  abs()
  log()
*/


function tokenize(expression) {

  const tokens = [];

  let i = 0;


  while (
    i < expression.length
  ) {

    const char =
      expression[i];


    /*
      Ignore spaces
    */

    if (
      /\s/.test(char)
    ) {

      i++;

      continue;

    }


    /*
      Number
    */

    if (
      /[0-9.]/.test(char)
    ) {

      let numberString = "";

      let dotCount = 0;


      while (
        i < expression.length
        &&
        /[0-9.]/.test(
          expression[i]
        )
      ) {

        if (
          expression[i] === "."
        ) {

          dotCount++;

        }


        if (
          dotCount > 1
        ) {

          throw new Error(
            "Invalid number."
          );

        }


        numberString +=
          expression[i];

        i++;

      }


      const value =
        Number(numberString);


      if (
        !Number.isFinite(value)
      ) {

        throw new Error(
          "Invalid number."
        );

      }


      tokens.push({
        type: "number",
        value: value
      });


      continue;

    }


    /*
      Variable / function / constant
    */

    if (
      /[a-zA-Z]/.test(char)
    ) {

      let word = "";


      while (
        i < expression.length
        &&
        /[a-zA-Z]/.test(
          expression[i]
        )
      ) {

        word +=
          expression[i];

        i++;

      }


      word =
        word.toLowerCase();


      tokens.push({
        type: "identifier",
        value: word
      });


      continue;

    }


    /*
      Operators
    */

    if (
      "+-*/^()".includes(char)
    ) {

      tokens.push({
        type: char
      });

      i++;

      continue;

    }


    throw new Error(
      "Unsupported character: "
      + char
    );

  }


  return tokens;

}


/* =========================================================
   Recursive descent parser
   ========================================================= */

function evaluateExpression(
  expression,
  xValue
) {

  const tokens =
    tokenize(expression);


  let position = 0;


  function currentToken() {

    return tokens[position];

  }


  function consume(type) {

    if (
      currentToken()
      &&
      currentToken().type === type
    ) {

      position++;

      return true;

    }


    return false;

  }


  /*
    expression:

    term
    + term
    - term
  */

  function parseExpression() {

    let value =
      parseTerm();


    while (
      position < tokens.length
    ) {

      if (
        consume("+")
      ) {

        value +=
          parseTerm();

      }

      else if (
        consume("-")
      ) {

        value -=
          parseTerm();

      }

      else {

        break;

      }

    }


    return value;

  }


  /*
    multiplication / division
  */

  function parseTerm() {

    let value =
      parseUnary();


    while (
      position < tokens.length
    ) {

      if (
        consume("*")
      ) {

        value *=
          parseUnary();

      }

      else if (
        consume("/")
      ) {

        const denominator =
          parseUnary();


        if (
          Math.abs(denominator)
          < 1e-14
        ) {

          throw new Error(
            "Division by zero."
          );

        }


        value /=
          denominator;

      }

      else {

        break;

      }

    }


    return value;

  }


  /*
    Unary + and -
  */

  function parseUnary() {

    if (
      consume("+")
    ) {

      return parseUnary();

    }


    if (
      consume("-")
    ) {

      return -parseUnary();

    }


    return parsePower();

  }


  /*
    Exponentiation
  */

  function parsePower() {

    let base =
      parsePrimary();


    if (
      consume("^")
    ) {

      const exponent =
        parseUnary();


      base =
        Math.pow(
          base,
          exponent
        );

    }


    return base;

  }


  /*
    Numbers

    x

    constants

    functions

    parentheses
  */

  function parsePrimary() {

    const token =
      currentToken();


    if (
      !token
    ) {

      throw new Error(
        "Unexpected end of expression."
      );

    }


    /*
      Number
    */

    if (
      token.type === "number"
    ) {

      position++;

      return token.value;

    }


    /*
      Parentheses
    */

    if (
      consume("(")
    ) {

      const value =
        parseExpression();


      if (
        !consume(")")
      ) {

        throw new Error(
          "Missing closing parenthesis."
        );

      }


      return value;

    }


    /*
      Identifier
    */

    if (
      token.type === "identifier"
    ) {

      position++;

      const name =
        token.value;


      /*
        variable x
      */

      if (
        name === "x"
      ) {

        return xValue;

      }


      /*
        constants
      */

      if (
        name === "pi"
      ) {

        return Math.PI;

      }


      if (
        name === "e"
      ) {

        return Math.E;

      }


      /*
        Mathematical functions
      */

      const allowedFunctions = {

        sin:
          Math.sin,

        cos:
          Math.cos,

        tan:
          Math.tan,

        exp:
          Math.exp,

        sqrt:
          Math.sqrt,

        abs:
          Math.abs,

        log:
          Math.log

      };


      if (
        name in allowedFunctions
      ) {

        if (
          !consume("(")
        ) {

          throw new Error(
            name
            + " must be followed by (...)."
          );

        }


        const argument =
          parseExpression();


        if (
          !consume(")")
        ) {

          throw new Error(
            "Missing closing parenthesis."
          );

        }


        const result =
          allowedFunctions[name](
            argument
          );


        if (
          !Number.isFinite(result)
        ) {

          throw new Error(
            "Function produced an invalid value."
          );

        }


        return result;

      }


      throw new Error(
        "Unknown symbol: "
        + name
      );

    }


    throw new Error(
      "Unexpected token."
    );

  }


  const result =
    parseExpression();


  if (
    position !== tokens.length
  ) {

    throw new Error(
      "Unexpected part of expression."
    );

  }


  if (
    !Number.isFinite(result)
  ) {

    throw new Error(
      "Expression produced an invalid value."
    );

  }


  return result;

}


/* =========================================================
   5. Initial condition
   ========================================================= */

function initialFunction(
  xValue
) {

  const type =
    document
      .getElementById(
        "initialCondition"
      )
      .value;


  /* ---------------------------------------------------------
     1. Sine
     --------------------------------------------------------- */

  if (
    type === "sine"
  ) {

    return Math.sin(
      Math.PI * xValue
    );

  }


  /* ---------------------------------------------------------
     2. Plucked string
     --------------------------------------------------------- */

  if (
    type === "pluck"
  ) {

    const x0 = 0.35;

    const A = 1.0;


    if (
      xValue <= x0
    ) {

      return (
        A
        * xValue
        / x0
      );

    }

    else {

      return (
        A
        * (L - xValue)
        / (L - x0)
      );

    }

  }


  /* ---------------------------------------------------------
     3. Gaussian pulse
     --------------------------------------------------------- */

  if (
    type === "gaussian"
  ) {

    const A = 1.0;

    const x0 = 0.5;

    const sigma = 0.08;


    return (

      A

      *

      Math.exp(

        -

        Math.pow(
          xValue - x0,
          2
        )

        /

        (
          2
          * sigma
          * sigma
        )

      )

    );

  }


  /* ---------------------------------------------------------
     4. Custom function
     --------------------------------------------------------- */

  if (
    type === "custom"
  ) {

    const expression =
      document
        .getElementById(
          "customFunction"
        )
        .value;


    return evaluateExpression(
      expression,
      xValue
    );

  }


  return 0;

}


/* =========================================================
   6. Initial condition UI
   ========================================================= */

function updateDescription() {

  const type =
    document
      .getElementById(
        "initialCondition"
      )
      .value;


  const description =
    document
      .getElementById(
        "initialDescription"
      );


  const customBox =
    document
      .getElementById(
        "customBox"
      );


  if (
    type === "sine"
  ) {

    description.textContent =
      "Initial displacement: f(x) = sin(πx), initial velocity: g(x) = 0";

    customBox.style.display =
      "none";

  }


  else if (
    type === "pluck"
  ) {

    description.textContent =
      "Triangular initial displacement with peak at x = 0.35, initial velocity: g(x) = 0";

    customBox.style.display =
      "none";

  }


  else if (
    type === "gaussian"
  ) {

    description.textContent =
      "Gaussian initial displacement centered at x = 0.5, initial velocity: g(x) = 0";

    customBox.style.display =
      "none";

  }


  else if (
    type === "custom"
  ) {

    description.textContent =
      "Enter a mathematical expression for the initial displacement f(x). Initial velocity: g(x) = 0";

    customBox.style.display =
      "block";

  }

}


/* =========================================================
   7. Initialize simulation
   ========================================================= */

function initializeWave() {

  time = 0;

  firstStepPending = true;


  const errorDisplay =
    document
      .getElementById(
        "customError"
      );


  errorDisplay.textContent =
    "";

  errorDisplay.className =
    "error";


  try {

    /*
      Initial displacement

      u(x,0) = f(x)
    */

    for (
      let i = 0;
      i <= N;
      i++
    ) {

      uCurr[i] =
        initialFunction(
          x[i]
        );

    }


    /*
      Fixed boundary conditions

      u(0,t) = 0

      u(L,t) = 0
    */

    uCurr[0] = 0;

    uCurr[N] = 0;


    uPrev =
      [...uCurr];


    uNext =
      new Array(
        N + 1
      ).fill(0);


    document
      .getElementById(
        "timeDisplay"
      )
      .textContent =
        time.toFixed(3);


    updateDescription();

    drawWave();


    if (
      document
        .getElementById(
          "initialCondition"
        )
        .value
      === "custom"
    ) {

      errorDisplay.textContent =
        "Function applied successfully.";

      errorDisplay.className =
        "error success";

    }

  }


  catch (
    error
  ) {

    running = false;


    errorDisplay.textContent =
      "Error: "
      + error.message;

  }

}


/* =========================================================
   8. Numerical solver
   ========================================================= */

function updateWave() {

  const r =
    c * dt / dx;


  /*
    First time step

    u_i^1

    = u_i^0
    + Δt g_i
    + 1/2 r²
      (u_{i+1}^0 - 2u_i^0 + u_{i-1}^0)

    Here

    g(x) = 0
  */

  if (
    firstStepPending
  ) {

    for (
      let i = 1;
      i < N;
      i++
    ) {

      uNext[i] =

        uCurr[i]

        +

        0.5
        * r
        * r

        *

        (
          uCurr[i + 1]

          - 2
          * uCurr[i]

          + uCurr[i - 1]
        );

    }


    uNext[0] = 0;

    uNext[N] = 0;


    uPrev =
      [...uCurr];

    uCurr =
      [...uNext];


    firstStepPending =
      false;


    time =
      dt;


    return;

  }


  /*
    Standard finite difference update

    u_i^(n+1)

    =

    2u_i^n
    - u_i^(n-1)

    +

    r²
    (
      u_(i+1)^n
      - 2u_i^n
      + u_(i-1)^n
    )
  */

  for (
    let i = 1;
    i < N;
    i++
  ) {

    uNext[i] =

      2
      * uCurr[i]

      -

      uPrev[i]

      +

      r
      * r

      *

      (
        uCurr[i + 1]

        - 2
        * uCurr[i]

        + uCurr[i - 1]
      );

  }


  /*
    Fixed endpoints
  */

  uNext[0] = 0;

  uNext[N] = 0;


  /*
    Advance time
  */

  uPrev =
    [...uCurr];

  uCurr =
    [...uNext];


  time +=
    dt;

}


/* =========================================================
   9. Canvas
   ========================================================= */

const canvas =
  document
    .getElementById(
      "waveCanvas"
    );


const ctx =
  canvas
    .getContext(
      "2d"
    );


/* =========================================================
   10. Draw graph
   ========================================================= */

function drawWave() {

  const width =
    canvas.width;

  const height =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /* ---------------------------------------------------------
     Plot dimensions
     --------------------------------------------------------- */

  const marginLeft =
    65;

  const marginRight =
    30;

  const marginTop =
    30;

  const marginBottom =
    55;


  const plotWidth =
    width
    - marginLeft
    - marginRight;


  const plotHeight =
    height
    - marginTop
    - marginBottom;


  /*
    Dynamic y-axis range

    기본 범위는 ±1.2이고
    custom function이 더 크면 자동 확장
  */

  let maxAmplitude =
    1;


  for (
    let i = 0;
    i <= N;
    i++
  ) {

    if (
      Number.isFinite(
        uCurr[i]
      )
    ) {

      maxAmplitude =
        Math.max(
          maxAmplitude,
          Math.abs(
            uCurr[i]
          )
        );

    }

  }


  const yRange =
    Math.max(
      1.2,
      maxAmplitude * 1.2
    );


  const yMin =
    -yRange;

  const yMax =
    yRange;


  /* ---------------------------------------------------------
     Coordinate transform
     --------------------------------------------------------- */

  function xToPixel(
    xValue
  ) {

    return (

      marginLeft

      +

      (xValue / L)

      * plotWidth

    );

  }


  function yToPixel(
    yValue
  ) {

    return (

      marginTop

      +

      (
        yMax - yValue
      )

      /

      (
        yMax - yMin
      )

      *

      plotHeight

    );

  }


  /* ---------------------------------------------------------
     Plot background
     --------------------------------------------------------- */

  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    marginLeft,
    marginTop,
    plotWidth,
    plotHeight
  );


  /* ---------------------------------------------------------
     Vertical grid
     --------------------------------------------------------- */

  ctx.strokeStyle =
    "#e6e6e6";

  ctx.lineWidth =
    1;


  for (
    let j = 0;
    j <= 10;
    j++
  ) {

    const xValue =
      j / 10;


    const px =
      xToPixel(
        xValue
      );


    ctx.beginPath();

    ctx.moveTo(
      px,
      marginTop
    );

    ctx.lineTo(
      px,
      marginTop + plotHeight
    );

    ctx.stroke();

  }


  /* ---------------------------------------------------------
     Horizontal grid
     --------------------------------------------------------- */

  const yTicks = [

    -yRange,

    -yRange / 2,

    0,

    yRange / 2,

    yRange

  ];


  for (
    const yValue
    of yTicks
  ) {

    const py =
      yToPixel(
        yValue
      );


    ctx.beginPath();

    ctx.moveTo(
      marginLeft,
      py
    );

    ctx.lineTo(
      marginLeft + plotWidth,
      py
    );

    ctx.stroke();

  }


  /* ---------------------------------------------------------
     Border
     --------------------------------------------------------- */

  ctx.strokeStyle =
    "#777";

  ctx.lineWidth =
    1;


  ctx.strokeRect(
    marginLeft,
    marginTop,
    plotWidth,
    plotHeight
  );


  /* ---------------------------------------------------------
     x axis = u = 0
     --------------------------------------------------------- */

  const zeroY =
    yToPixel(0);


  ctx.strokeStyle =
    "#555";

  ctx.lineWidth =
    1.4;


  ctx.beginPath();


  ctx.moveTo(
    marginLeft,
    zeroY
  );


  ctx.lineTo(
    marginLeft + plotWidth,
    zeroY
  );


  ctx.stroke();


  /* ---------------------------------------------------------
     x tick labels
     --------------------------------------------------------- */

  ctx.fillStyle =
    "#333";

  ctx.font =
    "13px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "top";


  for (
    let j = 0;
    j <= 10;
    j++
  ) {

    const xValue =
      j / 10;


    const px =
      xToPixel(
        xValue
      );


    ctx.fillText(
      xValue.toFixed(1),
      px,
      marginTop
      + plotHeight
      + 8
    );

  }


  /* ---------------------------------------------------------
     y tick labels
     --------------------------------------------------------- */

  ctx.textAlign =
    "right";

  ctx.textBaseline =
    "middle";


  for (
    const yValue
    of yTicks
  ) {

    const py =
      yToPixel(
        yValue
      );


    ctx.fillText(
      yValue.toFixed(2),
      marginLeft - 9,
      py
    );

  }


  /* ---------------------------------------------------------
     Axis titles
     --------------------------------------------------------- */

  ctx.fillStyle =
    "#111";

  ctx.font =
    "15px Arial";


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "bottom";


  ctx.fillText(
    "x",
    marginLeft
    + plotWidth / 2,
    height - 5
  );


  ctx.save();


  ctx.translate(
    18,
    marginTop
    + plotHeight / 2
  );


  ctx.rotate(
    -Math.PI / 2
  );


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    "u(x,t)",
    0,
    0
  );


  ctx.restore();


  /* ---------------------------------------------------------
     Wave
     --------------------------------------------------------- */

  ctx.strokeStyle =
    "#0066cc";

  ctx.lineWidth =
    3;


  ctx.beginPath();


  for (
    let i = 0;
    i <= N;
    i++
  ) {

    const px =
      xToPixel(
        x[i]
      );


    const py =
      yToPixel(
        uCurr[i]
      );


    if (
      i === 0
    ) {

      ctx.moveTo(
        px,
        py
      );

    }

    else {

      ctx.lineTo(
        px,
        py
      );

    }

  }


  ctx.stroke();


  /* ---------------------------------------------------------
     Fixed boundary points
     --------------------------------------------------------- */

  ctx.fillStyle =
    "#d00000";


  /*
    x = 0
  */

  ctx.beginPath();


  ctx.arc(
    xToPixel(0),
    yToPixel(0),
    5,
    0,
    2 * Math.PI
  );


  ctx.fill();


  /*
    x = L
  */

  ctx.beginPath();


  ctx.arc(
    xToPixel(L),
    yToPixel(0),
    5,
    0,
    2 * Math.PI
  );


  ctx.fill();

}


/* =========================================================
   11. Animation
   ========================================================= */

let running =
  false;


/*
  Number of numerical time steps
  performed for each screen frame.
*/

const stepsPerFrame =
  2;


function animate() {

  if (
    !running
  ) {

    return;

  }


  for (
    let step = 0;
    step < stepsPerFrame;
    step++
  ) {

    updateWave();

  }


  drawWave();


  document
    .getElementById(
      "timeDisplay"
    )
    .textContent =
      time.toFixed(3);


  requestAnimationFrame(
    animate
  );

}


/* =========================================================
   12. Play / Pause / Reset
   ========================================================= */

document
  .getElementById(
    "playButton"
  )
  .addEventListener(
    "click",
    function () {

      if (
        !running
      ) {

        running =
          true;


        requestAnimationFrame(
          animate
        );

      }

    }
  );


document
  .getElementById(
    "pauseButton"
  )
  .addEventListener(
    "click",
    function () {

      running =
        false;

    }
  );


document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function () {

      running =
        false;

      initializeWave();

    }
  );


/* =========================================================
   13. Initial condition selector
   ========================================================= */

document
  .getElementById(
    "initialCondition"
  )
  .addEventListener(
    "change",
    function () {

      running =
        false;


      updateDescription();


      initializeWave();

    }
  );


/* =========================================================
   14. Apply custom function
   ========================================================= */

document
  .getElementById(
    "applyCustomButton"
  )
  .addEventListener(
    "click",
    function () {

      running =
        false;


      initializeWave();

    }
  );


/*
  Enter key also applies function
*/

document
  .getElementById(
    "customFunction"
  )
  .addEventListener(
    "keydown",
    function (
      event
    ) {

      if (
        event.key === "Enter"
      ) {

        running =
          false;


        initializeWave();

      }

    }
  );


/* =========================================================
   15. Parameter display
   ========================================================= */

document
  .getElementById(
    "LDisplay"
  )
  .textContent =
    L.toFixed(2);


document
  .getElementById(
    "NDisplay"
  )
  .textContent =
    N;


document
  .getElementById(
    "dxDisplay"
  )
  .textContent =
    dx.toFixed(4);


document
  .getElementById(
    "cDisplay"
  )
  .textContent =
    c.toFixed(2);


document
  .getElementById(
    "dtDisplay"
  )
  .textContent =
    dt.toFixed(4);


document
  .getElementById(
    "cflDisplay"
  )
  .textContent =

    (
      c * dt / dx
    ).toFixed(3)

    +

    " ✓ Stable";


/* =========================================================
   16. Start
   ========================================================= */

updateDescription();

initializeWave();

</script>
